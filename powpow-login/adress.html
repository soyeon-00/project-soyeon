<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우편번호 찾기</title>
    <link rel="stylesheet" href="../assets/css/index.css"/> <!-- 필요한 CSS 파일 -->
    <link rel="stylesheet" href="../assets/css/login/login.css"/> <!-- 필요한 CSS 파일 -->
</head>
<body>
    <div class="postal-code">
        <h2>우편번호 찾기</h2>
        <input type="text" id="sample6_postcode" placeholder="우편번호">
        <input type="button" onclick="sample6_execDaumPostcode()" value="우편번호 찾기"><br>
        <input type="text" id="sample6_address" placeholder="주소"><br>
        <input type="text" id="sample6_detailAddress" placeholder="상세주소">
    </div>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        function sample6_execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    var addr = ''; // 주소 변수

                    // 선택한 주소 타입에 따라 주소 값을 가져온다.
                    addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;

                    // 우편번호와 주소 정보를 필드에 넣는다.
                    document.getElementById('sample6_postcode').value = data.zonecode;
                    document.getElementById("sample6_address").value = addr;
                    document.getElementById("sample6_detailAddress").focus(); // 상세주소 필드로 이동
                }
            }).open();
        }
    </script>
</body>
</html>
